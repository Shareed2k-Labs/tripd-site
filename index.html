<h1>tripd</h1>
<p>tripd is a trip planner for groups, on Android. Trips, stops, bookings, checklists and expenses live on the phones of the people on the trip: one phone runs the host and the others sync with it. There is no tripd server and no tripd account.</p>
<p><strong>Coming to Google Play.</strong></p>
